name: tech-growth-hub

services:
  api:
    image: tech-growth-hub-api:${APP_VERSION:?请在 .env 中设置镜像版本，如 v260805-1}
    build:
      context: ./api
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      - NODE_ENV=production
      - PORT=3001
      - TRUST_PROXY=1
      - AUTH_COOKIE_SECURE=${AUTH_COOKIE_SECURE:-auto}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:10089,http://127.0.0.1:10089}
      - JWT_SECRET=${JWT_SECRET:?请在 .env 中设置随机 JWT_SECRET}
      - AI_CONFIG_ENCRYPTION_KEY=${AI_CONFIG_ENCRYPTION_KEY:?请在 .env 中设置 AI 配置加密密钥}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN:-7d}
      - INIT_ADMIN_USERNAME=${INIT_ADMIN_USERNAME:-admin}
      - INIT_ADMIN_EMAIL=${INIT_ADMIN_EMAIL:-admin@localhost}
      - INIT_ADMIN_PASSWORD=${INIT_ADMIN_PASSWORD:-admin}
      - INIT_ADMIN_FORCE_PASSWORD_CHANGE=${INIT_ADMIN_FORCE_PASSWORD_CHANGE:-true}
      - DATABASE_TYPE=${DATABASE_TYPE:-mysql}
      - SQLITE_PATH=/app/data/tech-growth-hub.db
      - MYSQL_HOST=db
      - MYSQL_PORT=3306
      - MYSQL_USER=${MYSQL_USER:-tech_growth_hub}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:?请在 .env 中设置数据库密码}
      - MYSQL_DATABASE=${MYSQL_DATABASE:-tech_growth_hub}
      - AI_ENABLED=${AI_ENABLED:-true}
      - DEFAULT_AI_PROVIDER=${DEFAULT_AI_PROVIDER:-openai}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o-mini}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - DEEPSEEK_BASE_URL=${DEEPSEEK_BASE_URL:-https://api.deepseek.com/v1}
      - DEEPSEEK_MODEL=${DEEPSEEK_MODEL:-deepseek-chat}
      - QWEN_API_KEY=${QWEN_API_KEY:-}
      - QWEN_BASE_URL=${QWEN_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      - QWEN_MODEL=${QWEN_MODEL:-qwen-turbo}
      - DOUBAO_API_KEY=${DOUBAO_API_KEY:-}
      - DOUBAO_BASE_URL=${DOUBAO_BASE_URL:-https://ark.cn-beijing.volces.com/api/v3}
      - DOUBAO_MODEL=${DOUBAO_MODEL:-doubao-pro-4k}
      - WENXIN_API_KEY=${WENXIN_API_KEY:-}
      - WENXIN_BASE_URL=${WENXIN_BASE_URL:-https://aip.baidubce.com/rpc/2.0/ai_custom/v1/wenxinworkshop/chat}
      - WENXIN_MODEL=${WENXIN_MODEL:-ernie-bot-4}
      - ZHIPU_API_KEY=${ZHIPU_API_KEY:-}
      - ZHIPU_BASE_URL=${ZHIPU_BASE_URL:-https://open.bigmodel.cn/api/paas/v4}
      - ZHIPU_MODEL=${ZHIPU_MODEL:-glm-4}
    volumes:
      - app-data:/app/data
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3001/api/health/ready"]
      interval: 30s
      timeout: 10s
      retries: 3

  web:
    image: tech-growth-hub-web:${APP_VERSION:?请在 .env 中设置镜像版本，如 v260805-1}
    build:
      context: ./web
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "10089:8080"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 10s
      retries: 3

  db:
    image: mariadb:12.3.2
    restart: unless-stopped
    environment:
      - MARIADB_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:?请在 .env 中设置数据库 root 密码}
      - MARIADB_DATABASE=${MYSQL_DATABASE:-tech_growth_hub}
      - MARIADB_USER=${MYSQL_USER:-tech_growth_hub}
      - MARIADB_PASSWORD=${MYSQL_PASSWORD:?请在 .env 中设置数据库密码}
      - MARIADB_AUTO_UPGRADE=1
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mariadb --protocol=tcp -h 127.0.0.1 -u\"$${MARIADB_USER}\" -p\"$${MARIADB_PASSWORD}\" \"$${MARIADB_DATABASE}\" --skip-column-names -e 'SELECT 1' >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

volumes:
  app-data:
  db-data:
