name: tech-growth-hub-offline

services:
  web:
    image: registry.cn-beijing.aliyuncs.com/images-anhao/tech-growth-hub-web:v261008-3
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    # Avoid ambiguous service-name DNS on the shared external network.
    extra_hosts:
      api: "172.18.0.16"
    networks:
      mynetwork:
        ipv4_address: 172.18.0.15
    # For direct access through the host, enable ports: ["10089:8080"].
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 10s
      retries: 3

  api:
    image: registry.cn-beijing.aliyuncs.com/images-anhao/tech-growth-hub-api:v261008-3
    restart: unless-stopped
    env_file:
      - ./tech-growth-hub.env
    environment:
      NODE_ENV: production
      PORT: "3001"
      TRUST_PROXY: "1"
      DATABASE_TYPE: mysql
      MYSQL_HOST: db
      MYSQL_PORT: "3306"
      SQLITE_PATH: /app/data/tech-growth-hub.db
    extra_hosts:
      db: "172.18.0.17"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - type: bind
        source: /data/tiku/app-data
        target: /app/data
        bind:
          create_host_path: false
    networks:
      mynetwork:
        ipv4_address: 172.18.0.16
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3001/api/health/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  db:
    image: mariadb:12.3.2
    restart: unless-stopped
    env_file:
      - ./tech-growth-hub.env
    environment:
      MARIADB_AUTO_UPGRADE: "1"
    volumes:
      - type: bind
        source: /data/tiku/db-data
        target: /var/lib/mysql
        bind:
          create_host_path: false
    networks:
      mynetwork:
        ipv4_address: 172.18.0.17
    healthcheck:
      test: ["CMD-SHELL", "mariadb --protocol=tcp -h 127.0.0.1 -u\"$${MYSQL_USER}\" -p\"$${MYSQL_PASSWORD}\" \"$${MYSQL_DATABASE}\" --skip-column-names -e 'SELECT 1' >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

networks:
  mynetwork:
    external: true
    name: mynetwork
