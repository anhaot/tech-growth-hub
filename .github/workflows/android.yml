name: Android preview APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci
      - run: npm run typecheck && npm run lint && npm test && npm run test:scripts
      - run: npx expo prebuild --platform android --no-install
      # Preview builds use the generated debug key, and bundle JS for standalone use.
      - run: ./gradlew :app:assembleRelease --max-workers=2 --console=plain
        working-directory: mobile/android
        env:
          NODE_ENV: production
      - uses: actions/upload-artifact@v4
        with:
          name: tech-growth-hub-android-preview
          path: mobile/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
