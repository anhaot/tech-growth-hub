name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  packages: write

jobs:
  images:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        component: [api, web]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}-${{ matrix.component }}
          flavor: latest=false
          tags: |
            type=ref,event=tag
      - uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.component }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  portable-images:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        component: [api, web]
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build importable image archive
        env:
          COMPONENT: ${{ matrix.component }}
          ARCH: ${{ matrix.arch }}
          VERSION: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          archive="tech-growth-hub-${COMPONENT}-${VERSION}-linux-${ARCH}.tar"
          docker buildx build \
            --platform "linux/${ARCH}" \
            --tag "ghcr.io/${REPOSITORY}-${COMPONENT}:${VERSION}" \
            --output "type=docker,dest=${archive}" \
            "./${COMPONENT}"
          gzip -9 "${archive}"
      - uses: actions/upload-artifact@v4
        with:
          name: image-${{ matrix.component }}-${{ matrix.arch }}
          path: tech-growth-hub-${{ matrix.component }}-${{ github.ref_name }}-linux-${{ matrix.arch }}.tar.gz
          if-no-files-found: error
          retention-days: 7

  portable-database:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - name: Package importable MariaDB image
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          archive="mariadb-12.3.2-linux-${ARCH}.tar"
          docker pull --platform "linux/${ARCH}" mariadb:12.3.2
          docker save --output "${archive}" mariadb:12.3.2
          gzip -9 "${archive}"
      - uses: actions/upload-artifact@v4
        with:
          name: image-mariadb-${{ matrix.arch }}
          path: mariadb-12.3.2-linux-${{ matrix.arch }}.tar.gz
          if-no-files-found: error
          retention-days: 7

  release:
    runs-on: ubuntu-latest
    needs: [images, portable-images, portable-database]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            api/package-lock.json
            web/package-lock.json
      - run: npm ci
        working-directory: api
      - run: npm run build
        working-directory: api
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
      - name: Prepare production API dependencies
        run: npm prune --omit=dev
        working-directory: api
      - uses: actions/download-artifact@v4
        with:
          pattern: image-*
          path: release-assets
          merge-multiple: true
      - name: Package prebuilt application bundle
        run: |
          mkdir -p release/api release/web
          cp -R api/dist api/node_modules api/package.json api/package-lock.json release/api/
          cp -R web/dist web/nginx.conf release/web/
          cp compose.release.yaml .env.example LICENSE release/
          cp docs/release-assets.md release/README.md
          cp docs/release-assets.md release/RELEASE-ASSETS.md
          tar -czf "release-assets/tech-growth-hub-${GITHUB_REF_NAME}-prebuilt-linux-amd64.tar.gz" -C release .
      - name: Generate checksums
        run: |
          cd release-assets
          sha256sum *.tar.gz > SHA256SUMS
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" release-assets/* --generate-notes --verify-tag --title "$GITHUB_REF_NAME"
